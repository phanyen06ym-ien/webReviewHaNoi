<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đăng nhập Hanoi Food Review để quản lý bài viết và kế hoạch.">
    <title>Đăng nhập | Hanoi Food Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-page" data-page="login">
    <main class="auth-container">
        <section class="auth-illustration" aria-hidden="true">
            <i class="fa-solid fa-bowl-food"></i>
            <h2>Khám phá món ngon Hà Nội</h2>
            <p>Lưu địa điểm yêu thích và chia sẻ trải nghiệm của riêng bạn.</p>
        </section>
        <section class="auth-card card">
            <a class="auth-logo" href="../index.html"><span class="brand-mark"><i class="fa-solid fa-bowl-food"></i></span> Hanoi Food Review</a>
            <header class="auth-header"><h1>Chào mừng trở lại</h1><p>Đăng nhập để tiếp tục chia sẻ trải nghiệm.</p></header>
            <form class="auth-form" id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-identifier">Username hoặc email</label>
                    <input class="form-control" id="login-identifier" name="identifier" autocomplete="username">
                    <p class="field-error" id="login-identifier-error" aria-live="polite"></p>
                </div>
                <div class="form-group">
                    <label for="login-password">Mật khẩu</label>
                    <div class="password-field">
                        <input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password">
                        <button class="password-toggle" type="button" data-password-toggle data-target="login-password" aria-label="Hiện mật khẩu"><i class="fa-regular fa-eye"></i></button>
                    </div>
                    <p class="field-error" id="login-password-error" aria-live="polite"></p>
                </div>
                <label class="checkbox-group" for="login-remember"><input id="login-remember" type="checkbox"> <span>Ghi nhớ đăng nhập trên thiết bị này (mô phỏng)</span></label>
                <p class="auth-message" id="login-message" role="alert" aria-live="polite"></p>
                <button class="button button-primary auth-submit" type="submit">Đăng nhập</button>
            </form>
            <div class="demo-accounts"><strong>Tài khoản demo</strong><p>Admin: admin / 123456</p><p>Student: student / 123456</p></div>
            <p class="auth-links">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
            <a class="auth-home-link" href="../index.html"><i class="fa-solid fa-arrow-left"></i> Về trang chủ</a>
        </section>
    </main>
    <script src="../js/storage.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
