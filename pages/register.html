<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đăng ký tài khoản Hanoi Food Review.">
    <title>Đăng ký | Hanoi Food Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="auth-page" data-page="register">
    <main class="auth-container">
        <section class="auth-illustration" aria-hidden="true"><i class="fa-solid fa-users"></i><h2>Cộng đồng yêu ẩm thực</h2><p>Tạo tài khoản để viết review, lưu quán và quản lý hành trình khám phá.</p></section>
        <section class="auth-card card">
            <a class="auth-logo" href="../index.html"><span class="brand-mark"><i class="fa-solid fa-bowl-food"></i></span> Hanoi Food Review</a>
            <header class="auth-header"><h1>Tạo tài khoản</h1><p>Tham gia cộng đồng khám phá ẩm thực Hà Nội.</p></header>
            <form class="auth-form" id="register-form" novalidate>
                <div class="form-group"><label for="register-fullname">Họ và tên</label><input class="form-control" id="register-fullname" autocomplete="name"><p class="field-error" id="register-fullname-error" aria-live="polite"></p></div>
                <div class="form-group"><label for="register-username">Username</label><input class="form-control" id="register-username" autocomplete="username"><p class="field-error" id="register-username-error" aria-live="polite"></p></div>
                <div class="form-group"><label for="register-email">Email</label><input class="form-control" id="register-email" type="email" autocomplete="email"><p class="field-error" id="register-email-error" aria-live="polite"></p></div>
                <div class="form-group"><label for="register-password">Mật khẩu</label><div class="password-field"><input class="form-control" id="register-password" type="password" autocomplete="new-password"><button class="password-toggle" type="button" data-password-toggle data-target="register-password" aria-label="Hiện mật khẩu"><i class="fa-regular fa-eye"></i></button></div><p class="field-error" id="register-password-error" aria-live="polite"></p></div>
                <div class="form-group"><label for="register-confirm-password">Xác nhận mật khẩu</label><div class="password-field"><input class="form-control" id="register-confirm-password" type="password" autocomplete="new-password"><button class="password-toggle" type="button" data-password-toggle data-target="register-confirm-password" aria-label="Hiện mật khẩu"><i class="fa-regular fa-eye"></i></button></div><p class="field-error" id="register-confirm-password-error" aria-live="polite"></p></div>
                <div><label class="checkbox-group" for="register-agree"><input id="register-agree" type="checkbox"><span>Tôi đồng ý với điều khoản sử dụng mô phỏng.</span></label><p class="field-error" id="register-agree-error" aria-live="polite"></p></div>
                <button class="button button-primary auth-submit" type="submit">Đăng ký</button>
            </form>
            <p class="auth-links">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
            <a class="auth-home-link" href="../index.html"><i class="fa-solid fa-arrow-left"></i> Về trang chủ</a>
        </section>
    </main>
    <script src="../js/storage.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
